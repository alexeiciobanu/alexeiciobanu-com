<style>
:root{--bg:#fff;--fg:#1c2630;--navy:#152238;--navy-60:rgba(21,34,56,.7);--navy-40:rgba(21,34,56,.64);--muted:#647285;--rule:rgba(21,34,56,.1);--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 40px}
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--rule);padding:16px 0}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.nav-name{font-size:13px;font-weight:500;color:var(--navy)}
.nav-name a:hover{opacity:.6}
.back-link{font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-40)}
.back-link:hover{color:var(--navy)}
header{padding:72px 0 56px;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--navy-40);margin-bottom:20px}
h1{font-family:var(--serif);font-size:clamp(44px,7vw,64px);font-weight:300;line-height:1;color:var(--navy);margin-bottom:20px}
.intro{font-size:15px;font-weight:300;color:var(--navy-60);max-width:480px;line-height:1.7}
.notes-list{padding:56px 0 96px}
.note-item{padding:32px 0;border-top:1px solid var(--rule);display:block}
.note-item:last-child{border-bottom:1px solid var(--rule)}
.note-date{font-size:11px;font-weight:300;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.note-topic{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-40)}
.note-title{font-family:var(--serif);font-size:22px;font-weight:300;font-style:italic;color:var(--navy);line-height:1.4;text-wrap:pretty;display:block;transition:opacity .15s}
.note-item a:hover .note-title{opacity:.6}
@media(max-width:640px){.wrap{padding:0 24px}}
</style>
</head>
<body>
<nav>
<div class="wrap nav-inner">
<span class="nav-name"><a href="index.html">Alexei Ciobanu</a></span>
<a class="back-link" href="index.html">&larr; Back to profile</a>
</div>
</nav>
<div class="wrap">
<header>
<p class="eyebrow">Field Notes</p>
<h1>Short takes on<br><em style="font-style:italic;color:var(--navy-60)">product management.</em></h1>
<p class="intro">Unfiltered opinions on product strategy, platform work, and the state of the craft — written as they occur to me, not polished into essays.</p>
</header>
<div id="notes-full" class="notes-list"></div>
</div>
<script src="notes-data.js"></script>
<script>
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
document.getElementById('notes-full').innerHTML = FIELD_NOTES.map(n => `
  <div class="note-item">
    <a href="notes/${n.id}.html">
      <div class="note-date"><span class="note-topic">${n.topic}</span>${fmt(n.date)}</div>
      <span class="note-title">${n.excerpt}</span>
    </a>
  </div>
`).join('');
</script>
</body>
</html>
